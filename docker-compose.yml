version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: restren_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: restren_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: restren_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restren_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mysql://root:password@mysql:3306/restren_db"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restren_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
